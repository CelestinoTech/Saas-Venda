<!doctype html>
<html lang="pt-BR"
      xmlns:th="https://thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de Estado - Wolf Sistema</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .navbar-custom {
            background-color: #0d6efd;
        }

        .card-formulario {
            margin-top: 90px;
            border: none;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.10);
        }

        .card-header {
            background-color: #0d6efd;
            color: white;
            font-weight: 600;
        }

        .navbar-brand {
            font-weight: 600;
        }

        .form-label {
            font-weight: 500;
        }

        .acoes {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top">

    <div class="container-fluid">

        <img src="https://imagensemoldes.com.br/wp-content/uploads/2020/05/Logo-Lobo-PNG.png"
             alt="Logo"
             width="30"
             height="30">

        <a class="navbar-brand ms-2" href="/administrativo">
            Wolf Sistema
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#offcanvasNavbar">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="offcanvas offcanvas-end"
             tabindex="-1"
             id="offcanvasNavbar">

            <div class="offcanvas-header">

                <h5 class="offcanvas-title">
                    Menu Principal
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="offcanvas">
                </button>

            </div>

            <div class="offcanvas-body">

                <ul class="navbar-nav me-auto">

                    <li class="nav-item">
                        <a class="nav-link active"
                           href="/administrativo">
                            Início
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="/listarEstado">
                            Estados
                        </a>
                    </li>

                </ul>

                <form class="d-flex">

                    <input class="form-control me-2"
                           type="search"
                           placeholder="Pesquisar">

                    <button class="btn btn-light"
                            type="submit">
                        Pesquisar
                    </button>

                </form>

            </div>

        </div>

    </div>

</nav>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-10 col-lg-8">

            <div class="card card-formulario">

                <div class="card-header">
                    Cadastro de Estado
                </div>

                <div class="card-body">

                    <form action="/salvarEstado"
                          th:object="${estado}"
                          method="POST">

                        <div class="mb-3">

                            <label for="id"
                                   class="form-label">
                                Código
                            </label>

                            <input type="text"
                                   id="id"
                                   readonly
                                   class="form-control"
                                   th:field="*{id}">

                        </div>

                        <div class="mb-3">

                            <label for="nomeEstado"
                                   class="form-label">
                                Nome do Estado
                            </label>

                            <input type="text"
                                   id="nomeEstado"
                                   class="form-control"
                                   placeholder="Digite o nome do estado"
                                   th:field="*{nome}">

                        </div>

                        <div class="mb-3">

                            <label for="siglaEstado"
                                   class="form-label">
                                Sigla
                            </label>

                            <input type="text"
                                   id="siglaEstado"
                                   maxlength="2"
                                   class="form-control"
                                   placeholder="Ex: SP"
                                   th:field="*{sigla}">

                        </div>

                        <div class="acoes">

                            <button type="submit"
                                    class="btn btn-primary">

                                <i class="fa-solid fa-floppy-disk"></i>
                                Salvar

                            </button>

                            <a href="/administrativo"
                               class="btn btn-danger">

                                <i class="fa-solid fa-arrow-left"></i>
                                Voltar

                            </a>

                            <a href="/listarEstado"
                               class="btn btn-success">

                                <i class="fa-solid fa-list"></i>
                                Listar

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
