<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wolf Sistema</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f5f5;
        }

        .navbar-custom {
            background-color: #0d6efd;
        }

        .menu-lateral {
            background-color: #0d6efd !important;
            border-color: #0d6efd !important;
        }

        .conteudo-principal {
            padding: 20px;
        }

        .titulo-sistema {
            font-size: 3rem;
            font-weight: 300;
            line-height: 1.1;
        }

        .texto-sistema {
            font-size: 1.1rem;
            color: #444;
        }

        .rodape-sistema {
            margin-top: 40px;
            color: #555;
            font-size: 0.95rem;
        }

        .list-group-item {
            transition: 0.2s;
        }

        .list-group-item:hover {
            background-color: #f1f1f1;
        }

        @media (max-width: 768px) {
            .titulo-sistema {
                font-size: 2.4rem;
            }

            .conteudo-principal {
                margin-top: 20px;
            }
        }
    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top">

    <div class="container-fluid">

        <img src="Bootstrap_logo.svg.png"
             alt="Logo"
             width="30"
             height="30">

        <a class="navbar-brand ms-2" href="#">
            Wolf Sistema
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#offcanvasNavbar">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="offcanvas offcanvas-end"
             tabindex="-1"
             id="offcanvasNavbar">

            <div class="offcanvas-header">

                <h5 class="offcanvas-title">
                    Menu Principal
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="offcanvas">
                </button>

            </div>

            <div class="offcanvas-body">

                <ul class="navbar-nav me-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="#">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Cadastros
                        </a>
                    </li>

                </ul>

                <form class="d-flex">

                    <input class="form-control me-2"
                           type="search"
                           placeholder="Pesquisar">

                    <button class="btn btn-light"
                            type="submit">
                        Pesquisar
                    </button>

                </form>

            </div>

        </div>

    </div>

</nav>

<div class="container-fluid mt-5 pt-4">

    <div class="row">

        <div class="col-lg-3 col-md-4">

            <ul class="list-group">

                <li class="list-group-item active menu-lateral">
                    Menu
                </li>

                <a href="/cadastroEstado" class="text-decoration-none">
                    <li class="list-group-item">
                        Cadastro Estado
                    </li>
                </a>

                <a href="/listaEstado" class="text-decoration-none">
                    <li class="list-group-item">
                        Lista Estado
                    </li>
                </a>

            </ul>

        </div>

        <div class="col-lg-9 col-md-8">

            <div class="conteudo-principal">

                <h1 class="titulo-sistema">
                    Bem Vindo ao <br>
                    Sistema Wolf
                </h1>

                <p class="texto-sistema">
                    Sistema de vendas simplificado e intuitivo.
                </p>

                <p class="rodape-sistema">
                    © Feito em 2025 por Gabriel Celestino
                </p>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
